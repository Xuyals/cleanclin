<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Trabajador — Clean Clinn</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        .tabs {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 2rem;
            background: var(--fondo-2);
            border-radius: 999px;
            padding: 0.35rem;
            width: fit-content;
        }

        .tab {
            padding: 0.55rem 1.3rem;
            font-family: 'Nunito', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--texto-suave);
            cursor: pointer;
            border-radius: 999px;
            transition: all 0.2s;
            border: none;
            background: transparent;
        }

            .tab.activa {
                background: var(--blanco);
                color: var(--azul-dark);
                box-shadow: 0 2px 8px rgba(110, 181, 255, 0.18);
            }

            .tab:hover:not(.activa) {
                color: var(--texto);
                background: rgba(255,255,255,0.5);
            }

        /* Card trabajador con borde izquierdo según estado */
        .solicitud-card {
            border-left: 4px solid var(--borde);
            transition: border-color 0.2s, box-shadow 0.25s, transform 0.25s;
        }

            .solicitud-card[data-estado="Pendiente"] {
                border-left-color: var(--amarillo);
            }

            .solicitud-card[data-estado="Aceptada"] {
                border-left-color: var(--azul);
            }

            .solicitud-card[data-estado="Completada"] {
                border-left-color: var(--verde);
            }

            .solicitud-card[data-estado="Cancelada"] {
                border-left-color: var(--rojo);
            }

        /* Info chips */
        .meta-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: var(--fondo-2);
            border: 1px solid var(--borde);
            border-radius: 999px;
            padding: 0.25rem 0.7rem;
            font-size: 0.82rem;
            color: var(--texto-suave);
            font-weight: 600;
        }

        .meta-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
        }

        .costo-chip {
            background: var(--azul-bg);
            border-color: var(--azul-suave);
            color: var(--azul-dark);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Clean<span>Clinn</span></div>
        <nav>
            <button class="btn btn-outline btn-sm" id="btn-logout">Salir</button>
        </nav>
    </nav>

    <div class="page-content">

        <div class="dash-header">
            <div>
                <h1>Panel de trabajo 🧹</h1>
                <p class="welcome" id="bienvenida">Hola 👋</p>
            </div>
        </div>

        <div class="tabs">
            <div class="tab activa" id="tab-disponibles" onclick="cambiarTab('disponibles')">📋 Disponibles</div>
            <div class="tab" id="tab-mis-servicios" onclick="cambiarTab('mis-servicios')">🧺 Mis servicios</div>
        </div>

        <div id="contenedor">
            <div class="loader"><div class="spinner"></div></div>
        </div>

    </div>

    <div id="toast"></div>

    <script>
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function () {
                this.classList.remove('ripple-active');
                void this.offsetWidth;
                this.classList.add('ripple-active');
                setTimeout(() => this.classList.remove('ripple-active'), 600);
            });
        });
    </script>

    <script type="module">
        import { getSolicitudes, aceptarSolicitud, completarSolicitud } from '/js/api.js';
        import { mostrarToast, badgeEstado, requireAuth, logout } from '/js/utils.js';

        requireAuth();

        const nombre = localStorage.getItem("nombre");
        document.getElementById("bienvenida").textContent = `Hola, ${nombre} 👋`;
        document.getElementById("btn-logout").addEventListener("click", logout);

        let todas = [];
        let tabActiva = "disponibles";

        async function cargar() {
            try {
                todas = await getSolicitudes();
                renderizar();
            } catch (err) {
                mostrarToast("Error al cargar solicitudes", true);
            }
        }

        function renderizar() {
            const c = document.getElementById("contenedor");

            let lista;
            if (tabActiva === "disponibles") {
                lista = todas.filter(s => s.estado === "Pendiente");
            } else {
                lista = todas.filter(s => s.estado !== "Pendiente");
            }

            if (lista.length === 0) {
                const msg = tabActiva === "disponibles"
                    ? "No hay solicitudes disponibles en este momento"
                    : "Aún no tienes servicios asignados";
                c.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">${tabActiva === "disponibles" ? "📭" : "🧺"}</div>
                            <p>${msg}</p>
                        </div>`;
                return;
            }

            c.innerHTML = `<div style="display:flex; flex-direction:column; gap:1rem;">
                    ${lista.map(s => `
                    <div class="solicitud-card" data-estado="${s.estado}">
                        <div class="top">
                            <div class="tipo">${s.tipoServicio}</div>
                            ${badgeEstado(s.estado)}
                        </div>
                        <div class="meta-chips">
                            <span class="meta-chip">📍 ${s.direccion}</span>
                            <span class="meta-chip">👤 ${s.nombreUsuario}</span>
                            <span class="meta-chip costo-chip">💰 $${s.costoEstimado.toLocaleString()}</span>
                            <span class="meta-chip">🕐 ${s.fechaCreacion}</span>
                        </div>
                        <div class="acciones">
                            ${s.estado === "Pendiente"
                    ? `<button class="btn btn-primary btn-sm" onclick="aceptar(${s.id})">✓ Aceptar</button>`
                    : ""}
                            ${s.estado === "Aceptada"
                    ? `<button class="btn btn-success btn-sm" onclick="completar(${s.id})">✅ Marcar completado</button>`
                    : ""}
                        </div>
                    </div>
                    `).join("")}
                </div>`;

            // Efecto burbujas en botones generados dinámicamente
            document.querySelectorAll('.btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    this.classList.remove('ripple-active');
                    void this.offsetWidth;
                    this.classList.add('ripple-active');
                    setTimeout(() => this.classList.remove('ripple-active'), 600);
                });
            });
        }

        window.cambiarTab = function (tab) {
            tabActiva = tab;
            document.getElementById("tab-disponibles").classList.toggle("activa", tab === "disponibles");
            document.getElementById("tab-mis-servicios").classList.toggle("activa", tab === "mis-servicios");
            renderizar();
        };

        window.aceptar = async function (id) {
            try {
                await aceptarSolicitud(id);
                mostrarToast("Solicitud aceptada ✓");
                cargar();
            } catch (err) {
                mostrarToast(err.message, true);
            }
        };

        window.completar = async function (id) {
            try {
                await completarSolicitud(id);
                mostrarToast("Servicio marcado como completado ✅");
                cargar();
            } catch (err) {
                mostrarToast(err.message, true);
            }
        };

        cargar();
    </script>
</body>
</html>
