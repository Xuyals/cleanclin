<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrarse — Clean Clinn</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        .auth-page {
            background: radial-gradient(ellipse at 20% 20%, rgba(110,181,255,0.15) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(133,217,176,0.12) 0%, transparent 50%), var(--fondo);
            align-items: flex-start;
            padding: 2rem 1rem;
        }

        .auth-box {
            animation: fadeUp 0.4s ease forwards;
            margin: auto;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-top {
            font-family: 'Nunito', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 1.8rem;
            color: var(--texto);
        }

            .logo-top span {
                color: var(--azul-dark);
            }

        .auth-box h2 {
            text-align: center;
        }

        .auth-box .subtitle {
            text-align: center;
        }

        /* Selector de tipo */
        .tipo-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin: 1.5rem 0;
        }

        .tipo-btn {
            background: var(--fondo-2);
            border: 2px solid var(--borde);
            border-radius: var(--radio);
            padding: 1.1rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

            .tipo-btn:hover {
                border-color: var(--azul-suave);
                background: var(--blanco);
            }

            .tipo-btn.activo {
                border-color: var(--azul);
                background: var(--azul-bg);
                box-shadow: 0 0 0 3px rgba(110,181,255,0.15);
            }

            .tipo-btn .icono {
                font-size: 1.8rem;
                margin-bottom: 0.4rem;
                display: block;
            }

            .tipo-btn strong {
                font-family: 'Nunito', sans-serif;
                font-size: 0.95rem;
                color: var(--texto);
            }

            .tipo-btn.activo strong {
                color: var(--azul-dark);
            }

            .tipo-btn p {
                font-size: 0.78rem;
                color: var(--texto-suave);
                margin-top: 0.2rem;
                font-weight: 500;
            }

        #campo-especialidad {
            display: none;
        }

        /* Input con ojo */
        .input-wrapper {
            position: relative;
        }

            .input-wrapper input {
                padding-right: 2.8rem;
            }

        .toggle-pass {
            position: absolute;
            right: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--texto-claro);
            transition: color 0.2s;
            user-select: none;
        }

            .toggle-pass:hover {
                color: var(--azul-dark);
            }

        .btn-register-full {
            width: 100%;
            justify-content: center;
            padding: 0.9rem;
            font-size: 1rem;
            margin-top: 0.3rem;
        }

        .volver-link {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.85rem;
            color: var(--texto-suave);
            font-weight: 600;
            transition: color 0.2s;
            justify-content: center;
            width: 100%;
            margin-top: 0.5rem;
        }

            .volver-link:hover {
                color: var(--azul-dark);
            }
    </style>
</head>
<body class="auth-page">

    <div class="auth-box" style="max-width:480px;">

        <div class="logo-top">Clean<span>Clinn</span></div>

        <h2>Crear cuenta ✨</h2>
        <p class="subtitle">Únete a Clean Clinn</p>

        <div class="tipo-selector">
            <div class="tipo-btn activo" id="btn-usuario" onclick="seleccionarTipo('usuario')">
                <span class="icono">🏠</span>
                <strong>Usuario</strong>
                <p>Solicito servicios</p>
            </div>
            <div class="tipo-btn" id="btn-trabajador" onclick="seleccionarTipo('trabajador')">
                <span class="icono">🔧</span>
                <strong>Trabajador</strong>
                <p>Ofrezco servicios</p>
            </div>
        </div>

        <div class="form-group">
            <label>Nombre completo</label>
            <input type="text" id="nombre" placeholder="Tu nombre" autocomplete="name" />
        </div>

        <div class="form-group">
            <label>Correo electrónico</label>
            <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email" />
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
                <span class="toggle-pass" id="toggle-pass">👁️</span>
            </div>
        </div>

        <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" id="telefono" placeholder="3001234567" autocomplete="tel" />
        </div>

        <div class="form-group">
            <label>Dirección <span style="color:var(--texto-claro); font-weight:500; text-transform:none; letter-spacing:0;">(opcional)</span></label>
            <input type="text" id="direccion" placeholder="Calle 123 # 45-67" autocomplete="street-address" />
        </div>

        <div class="form-group" id="campo-especialidad">
            <label>Especialidad</label>
            <select id="especialidad">
                <option value="">Selecciona tu especialidad</option>
                <option value="Limpieza">🧹 Limpieza</option>
                <option value="Plomería">🔧 Plomería</option>
                <option value="Electricidad">⚡ Electricidad</option>
                <option value="Gas">🔥 Gas</option>
                <option value="Vidrios">🪟 Vidrios</option>
                <option value="Reparaciones Generales">🏠 Reparaciones Generales</option>
            </select>
        </div>

        <button class="btn btn-primary btn-register-full" id="btn-register">
            Crear cuenta
        </button>

        <div class="auth-switch" style="margin-top:1rem;">
            ¿Ya tienes cuenta? <a href="/login.html">Iniciar sesión</a>
        </div>

        <a class="volver-link" href="/index.html">← Volver al inicio</a>

    </div>

    <div id="toast"></div>

    <script>
        // Efecto burbujas
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function () {
                this.classList.remove('ripple-active');
                void this.offsetWidth;
                this.classList.add('ripple-active');
                setTimeout(() => this.classList.remove('ripple-active'), 600);
            });
        });

        // Mostrar/ocultar contraseña
        const togglePass = document.getElementById('toggle-pass');
        const passInput = document.getElementById('password');
        togglePass.addEventListener('click', () => {
            const visible = passInput.type === 'text';
            passInput.type = visible ? 'password' : 'text';
            togglePass.textContent = visible ? '👁️' : '🙈';
        });
    </script>

    <script type="module">
        import { register } from '/js/api.js';
        import { mostrarToast } from '/js/utils.js';

        let tipoSeleccionado = "usuario";

        window.seleccionarTipo = function (tipo) {
            tipoSeleccionado = tipo;
            document.getElementById("btn-usuario").classList.toggle("activo", tipo === "usuario");
            document.getElementById("btn-trabajador").classList.toggle("activo", tipo === "trabajador");
            document.getElementById("campo-especialidad").style.display = tipo === "trabajador" ? "flex" : "none";
        };

        document.getElementById("btn-register").addEventListener("click", async () => {
            const nombre = document.getElementById("nombre").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const telefono = document.getElementById("telefono").value.trim();
            const direccion = document.getElementById("direccion").value.trim();
            const especialidad = document.getElementById("especialidad").value;

            if (!nombre || !email || !password || !telefono) {
                mostrarToast("Completa todos los campos obligatorios", true);
                return;
            }

            if (tipoSeleccionado === "trabajador" && !especialidad) {
                mostrarToast("Selecciona tu especialidad", true);
                return;
            }

            const btn = document.getElementById("btn-register");
            btn.disabled = true;
            btn.textContent = "Creando cuenta...";

            try {
                await register({
                    nombre,
                    email,
                    password,
                    telefono,
                    direccion,
                    especialidad: tipoSeleccionado === "trabajador" ? especialidad : ""
                });
                mostrarToast("¡Cuenta creada! Ahora inicia sesión 🎉");
                setTimeout(() => window.location.href = "/login.html", 1200);
            } catch (err) {
                mostrarToast(err.message, true);
                btn.disabled = false;
                btn.textContent = "Crear cuenta";
            }
        });
    </script>
</body>
</html>
