<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calificar servicio — Clean Clinn</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        .star-selector {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .star {
            font-size: 2.5rem;
            cursor: pointer;
            color: var(--gris-borde);
            transition: color 0.15s, transform 0.15s;
            line-height: 1;
        }

            .star.activa, .star:hover {
                color: var(--amarillo);
                transform: scale(1.1);
            }

        .star-label {
            font-size: 0.85rem;
            color: var(--gris-texto);
            margin-bottom: 1.2rem;
            min-height: 1.2em;
        }
    </style>
</head>
<body class="auth-page">

    <div class="auth-box" style="max-width:460px;">
        <h2>Calificar servicio ⭐</h2>
        <p class="subtitle">Cuéntanos cómo te fue</p>

        <div class="form-group" style="margin-bottom:0.5rem;">
            <label>Puntaje</label>
            <div class="star-selector" id="star-selector">
                <span class="star" data-val="1">★</span>
                <span class="star" data-val="2">★</span>
                <span class="star" data-val="3">★</span>
                <span class="star" data-val="4">★</span>
                <span class="star" data-val="5">★</span>
            </div>
            <div class="star-label" id="star-label">Selecciona un puntaje</div>
        </div>

        <div class="form-group">
            <label>Comentario (opcional)</label>
            <textarea id="comentario" placeholder="¿Cómo fue el servicio? ¿Llegó a tiempo? ¿Resolvió el problema?"></textarea>
        </div>

        <button class="btn btn-primary" id="btn-calificar" style="width:100%; justify-content:center; padding:0.85rem;">
            Enviar calificación
        </button>

        <div class="auth-switch" style="margin-top:1rem;">
            <a href="/pages/dashboard-usuario.html">← Volver a mis solicitudes</a>
        </div>
    </div>

    <div id="toast"></div>

    <script type="module">
    import { calificar } from '/js/api.js';
    import { mostrarToast, requireAuth } from '/js/utils.js';

    requireAuth();

    const params = new URLSearchParams(window.location.search);
    const solicitudId = parseInt(params.get("solicitudId"));

    if (!solicitudId) {
      window.location.href = "/pages/dashboard-usuario.html";
    }

    const etiquetas = ["", "Muy malo", "Malo", "Regular", "Bueno", "Excelente"];
    let puntajeSeleccionado = 0;

    const estrellas = document.querySelectorAll(".star");

    estrellas.forEach(star => {
      star.addEventListener("click", () => {
        puntajeSeleccionado = parseInt(star.dataset.val);
        document.getElementById("star-label").textContent = etiquetas[puntajeSeleccionado];
        estrellas.forEach(s => {
          s.classList.toggle("activa", parseInt(s.dataset.val) <= puntajeSeleccionado);
        });
      });

      star.addEventListener("mouseover", () => {
        const val = parseInt(star.dataset.val);
        estrellas.forEach(s => {
          s.style.color = parseInt(s.dataset.val) <= val ? "var(--amarillo)" : "var(--gris-borde)";
        });
      });

      star.addEventListener("mouseout", () => {
        estrellas.forEach(s => {
          s.style.color = parseInt(s.dataset.val) <= puntajeSeleccionado ? "var(--amarillo)" : "var(--gris-borde)";
        });
      });
    });

    document.getElementById("btn-calificar").addEventListener("click", async () => {
      if (puntajeSeleccionado === 0) {
        mostrarToast("Selecciona un puntaje", true);
        return;
      }

      const comentario = document.getElementById("comentario").value.trim();
      const btn = document.getElementById("btn-calificar");
      btn.disabled = true;
      btn.textContent = "Enviando...";

      try {
        await calificar(solicitudId, puntajeSeleccionado, comentario);
        mostrarToast("¡Gracias por tu calificación!");
        setTimeout(() => window.location.href = "/pages/dashboard-usuario.html", 1200);
      } catch (err) {
        mostrarToast(err.message, true);
        btn.disabled = false;
        btn.textContent = "Enviar calificación";
      }
    });
    </script>
</body>
</html>
