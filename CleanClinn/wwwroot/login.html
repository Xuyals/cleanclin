<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión — Clean Clinn</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">

    <div class="auth-box">
        <h2>Bienvenido 👋</h2>
        <p class="subtitle">Ingresa con tu cuenta de Clean Clinn</p>

        <div class="form-group">
            <label>Correo electrónico</label>
            <input type="email" id="email" placeholder="tu@correo.com" />
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" />
        </div>

        <button class="btn btn-primary" id="btn-login" style="width:100%; justify-content:center; padding:0.85rem;">
            Iniciar sesión
        </button>

        <div class="auth-switch">
            ¿No tienes cuenta? <a href="/register.html">Regístrate</a>
        </div>
        <div class="auth-switch" style="margin-top:0.5rem;">
            <a href="/index.html">← Volver al inicio</a>
        </div>
    </div>

    <div id="toast"></div>

    <script type="module">
    import { login } from '/js/api.js';
    import { mostrarToast } from '/js/utils.js';

    document.getElementById("btn-login").addEventListener("click", async () => {
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        mostrarToast("Completa todos los campos", true);
        return;
      }

      const btn = document.getElementById("btn-login");
      btn.disabled = true;
      btn.textContent = "Ingresando...";

      try {
        const datos = await login(email, password);
        mostrarToast("Bienvenido, " + datos.nombre);

        setTimeout(() => {
          if (datos.rol === "Trabajador") {
            window.location.href = "/pages/dashboard-trabajador.html";
          } else {
            window.location.href = "/pages/dashboard-usuario.html";
          }
        }, 800);

      } catch (err) {
        mostrarToast(err.message, true);
        btn.disabled = false;
        btn.textContent = "Iniciar sesión";
      }
    });

    // Enter para enviar
    document.getElementById("password").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("btn-login").click();
    });
    </script>
</body>
</html>
